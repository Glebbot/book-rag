name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/book-rag-backend

    steps:
      - uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run unit tests
        run: uv run pytest tests/ --cov=book_rag_backend --cov-report=term --cov-config=.coveragerc

  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: test-backend
    defaults:
      run:
        working-directory: ./src/book-rag-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Build backend package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: ./src/book-rag-backend
          retention-days: 5

  push-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: build-backend
    defaults:
      run:
        working-directory: ./src/book-rag-backend
    steps:
      - uses: actions/checkout@v4
      - name: Get repository owner
        run: |
          echo "OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Install Docker
        uses: docker/setup-buildx-action@v3
      - name: Artifactory login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./src/book-rag-backend
          file: ./src/book-rag-backend/Dockerfile
          push: true
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ github.event.repository.name }}/book-rag-backend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ github.event.repository.name }}/book-rag-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check image
        run: docker images | grep ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ github.event.repository.name }}/book-rag-backend

  test-frontend:
    runs-on: ubuntu-latest
    needs: build-backend
    defaults:
      run:
        working-directory: ./src/book-rag-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage -- --run

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: ./src/book-rag-frontend/coverage/
          retention-days: 7

  build-frontend:
    runs-on: ubuntu-latest
    needs: test-frontend
    defaults:
      run:
        working-directory: ./src/book-rag-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: '24'
          cache-dependency-path: ./src/book-rag-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  push-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: build-frontend
    defaults:
      run:
        working-directory: ./src/book-rag-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Get repository owner
        run: |
          echo "OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Install Docker
        uses: docker/setup-buildx-action@v3
      - name: Artifactory login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./src/book-rag-frontend
          file: ./src/book-rag-frontend/Dockerfile
          push: true
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ github.event.repository.name }}/book-rag-frontend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ github.event.repository.name }}/book-rag-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check image
        run: docker images | grep ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ github.event.repository.name }}/book-rag-frontend

  argocd-version-change:
    runs-on: ubuntu-latest
    needs: [ push-backend, push-frontend ]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Update Helm values
        run: |
          VALUES_FILE="k8s/book-rag-chart/values.yaml"

          yq -i ".backend.image.tag = \"${{ github.sha }}\"" "$VALUES_FILE"
          yq -i ".frontend.image.tag = \"${{ github.sha }}\"" "$VALUES_FILE"

      - name: Commit Helm values
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: |
            chore(helm): update image tags to ${{ github.sha }} [skip ci]
          file_pattern: 'k8s/book-rag-chart/values.yaml'

  notify-telegram:
    runs-on: ubuntu-latest
    needs: [ push-backend, push-frontend, argocd-version-change ]
    if: always()
    permissions:
      contents: read
      actions: read
    steps:
      - name: Generate dynamic job statuses
        id: gen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JOBS_RAW=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100)

          JOBS_MD=$(echo "$JOBS_RAW" | jq -r '
            .jobs
            | map(select(.name != "notify-telegram"))
            | map({
                name: .name,
                status: (.conclusion // "skipped"),
                emoji: (if .conclusion == "success" then "✅"
                        elif .conclusion == "failure" then "❌"
                        elif .conclusion == "cancelled" then "⚠️"
                        else "⏭️" end)
              })
            | map("\(.emoji) \(.name): \(.status)")
            | join("\n")
          ')

          OVERALL=$(echo "$JOBS_RAW" | jq -r '
            [.jobs[].conclusion] | map(select(. != null)) |
            if length == 0 then "pending"
            elif any(. == "failure") then "failure"
            elif all(. == "success") then "success"
            else "cancelled"
            end
          ')

          case "$OVERALL" in
            success)   O_EMOJI="✅"; O_TEXT="Успешно" ;;
            failure)   O_EMOJI="❌"; O_TEXT="С ошибками" ;;
            cancelled) O_EMOJI="⚠️"; O_TEXT="Отменён" ;;
            *)         O_EMOJI="⏳"; O_TEXT="В процессе" ;;
          esac

          echo "jobs_list<<EOF" >> $GITHUB_OUTPUT
          echo "$JOBS_MD" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "overall_emoji=$O_EMOJI" >> $GITHUB_OUTPUT
          echo "overall_text=$O_TEXT" >> $GITHUB_OUTPUT
          echo "timestamp=$(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          disable_web_page_preview: true
          message: |
            ${{ steps.gen.outputs.overall_emoji }} *CI/CD Pipeline: ${{ steps.gen.outputs.overall_text }}*

            *📦 Репозиторий:* `${{ github.repository }}`
            *🌿 Ветка:* `${{ github.ref_name }}`
            *👤 Автор:* ${{ github.actor }}
            *🔗 Запуск:* [Посмотреть логи](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            *📊 Статусы джоб:*
            ${{ steps.gen.outputs.jobs_list }}

            *⏰ Завершён:* ${{ steps.gen.outputs.timestamp }}
