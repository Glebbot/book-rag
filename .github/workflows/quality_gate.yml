name: SonarQube Quality Gate
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  GITHUB_OWNER_RAW: ${{ github.repository_owner }}
  GITHUB_REPO_RAW: ${{ github.event.repository.name }}
  SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY}}
  SONAR_ORGANIZATION: glebbot
  SONAR_HOST_URL: https://sonarcloud.io

jobs:

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/book-rag-backend
    outputs:
      coverage-enabled: ${{ steps.check-coverage.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ \
            --cov=book_rag_backend \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --cov-config=.coveragerc

      - name: Check if coverage report exists
        id: check-coverage
        run: |
          if [ -f "src/book-rag-backend/coverage.xml" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi
      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: ./src/book-rag-backend/coverage.xml
          retention-days: 7

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/book-rag-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage -- --run --coverage.reporter=lcov
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: ./src/book-rag-frontend/coverage/lcov.info
          retention-days: 7

  sonarqube-scan:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: always() && (needs.test-backend.result == 'success' || needs.test-frontend.result == 'success')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        if: needs.test-frontend.result == 'success'
        with:
          name: frontend-coverage-report
          path: ./src/book-rag-frontend/coverage/

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        if: needs.test-backend.result == 'success'
        with:
          name: backend-coverage-report
          path: ./src/book-rag-backend

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }}
            -Dsonar.sources=src/book-rag-backend/book_rag_backend,src/book-rag-frontend/src
            -Dsonar.tests=src/book-rag-backend/tests,src/book-rag-frontend/src
            -Dsonar.python.coverage.reportPaths=src/book-rag-backend/coverage.xml
            -Dsonar.javascript.lcov.reportPaths=src/book-rag-frontend/coverage/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/*.config.*,**/coverage/**,**/venv/**,src/book-rag-frontend/src/assets/**,**/Dockerfile*,**/*.dockerfile,**/docker-compose*.yml,**/docker-compose*.yaml,src/book-rag-backend/book_rag_backend/app.py,**/api/**,src/book-rag-frontend/src/App.jsx,src/book-rag-frontend/src/pages/BooksPage.jsx,**/*.test.*,**/index.jsx,**/main.jsx,src/book-rag-frontend/src/pages/ChatPage.jsx,src/book-rag-backend/book_rag_backend/config.py,src/book-rag-backend/book_rag_backend/services/parser.py
            -Dsonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/tests/**
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.scm.disabled=false
            -Dsonar.verbose=false

  notify-telegram:
    runs-on: ubuntu-latest
    needs: [ sonarqube-scan ]
    if: always()
    permissions:
      contents: read
      actions: read
    steps:
      - name: Generate dynamic job statuses
        id: gen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JOBS_RAW=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100)

          JOBS_MD=$(echo "$JOBS_RAW" | jq -r '
            .jobs
            | map(select(.name != "notify-telegram"))
            | map({
                name: .name,
                status: (.conclusion // "skipped"),
                emoji: (if .conclusion == "success" then "✅"
                        elif .conclusion == "failure" then "❌"
                        elif .conclusion == "cancelled" then "⚠️"
                        else "⏭️" end)
              })
            | map("\(.emoji) \(.name): \(.status)")
            | join("\n")
          ')

          OVERALL=$(echo "$JOBS_RAW" | jq -r '
            [.jobs[].conclusion] | map(select(. != null)) |
            if length == 0 then "pending"
            elif any(. == "failure") then "failure"
            elif all(. == "success") then "success"
            else "cancelled"
            end
          ')

          case "$OVERALL" in
            success)   O_EMOJI="✅"; O_TEXT="Успешно" ;;
            failure)   O_EMOJI="❌"; O_TEXT="С ошибками" ;;
            cancelled) O_EMOJI="⚠️"; O_TEXT="Отменён" ;;
            *)         O_EMOJI="⏳"; O_TEXT="В процессе" ;;
          esac

          echo "jobs_list<<EOF" >> $GITHUB_OUTPUT
          echo "$JOBS_MD" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "overall_emoji=$O_EMOJI" >> $GITHUB_OUTPUT
          echo "overall_text=$O_TEXT" >> $GITHUB_OUTPUT
          echo "timestamp=$(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          disable_web_page_preview: true
          message: |
            ${{ steps.gen.outputs.overall_emoji }} *SonarQube Quality gate: ${{ steps.gen.outputs.overall_text }}*

            *📦 Репозиторий:* `${{ github.repository }}`
            *🌿 Ветка:* `${{ github.ref_name }}`
            *👤 Автор:* ${{ github.actor }}
            *🔗 Запуск:* [Посмотреть логи](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            *📊 Статусы джоб:*
            ${{ steps.gen.outputs.jobs_list }}

            *⏰ Завершён:* ${{ steps.gen.outputs.timestamp }}