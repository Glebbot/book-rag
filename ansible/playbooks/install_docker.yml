- name: Install Docker
  hosts: all
  become: true
  vars:
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    docker_gpg_key_url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    docker_repo_url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"

  tasks:
    - name: Install prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Add Docker GPG key
      apt_key:
        url: "{{ docker_gpg_key_url }}"
        state: present
      when: ansible_os_family == "Debian"

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] {{ docker_repo_url }} {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
      when: ansible_os_family == "Debian"

    - name: Install Docker Engine
      apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Add current user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
      when: ansible_os_family == "Debian"

    - name: Ensure Docker service is running and enabled
      systemd:
        name: docker
        state: started
        enabled: true
        daemon_reload: yes
      when: ansible_os_family == "Debian"