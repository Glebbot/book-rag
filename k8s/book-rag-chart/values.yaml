# Global settings
global:
  namespace: book-rag
  imagePullSecrets:
    - name: ghcr-secret
  secretRef: app-secrets
# Qdrant configuration
qdrant:
  enabled: true
  name: qdrant
  image:
    repository: qdrant/qdrant
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  strategy: Recreate
  ports:
    http: 6333
    grpc: 6334
  service:
    type: ClusterIP
  storage:
    pvcName: qdrant-pvc
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  resources:
    requests:
      cpu: 500m
      memory: 1024Mi
    limits:
      cpu: 2000m
      memory: 4096Mi
  probes:
    liveness:
      path: /readyz
      initialDelaySeconds: 30
      periodSeconds: 10
    readiness:
      path: /readyz
      initialDelaySeconds: 5
      periodSeconds: 5
# Backend configuration
backend:
  enabled: true
  name: backend
  image:
    repository: ghcr.io/glebbot/book-rag/book-rag-backend
    tag: 116281bbab646dc9bdc18920c3a6258783d03449
    pullPolicy: Always
  replicas: 1
  ports:
    http: 8000
  service:
    type: ClusterIP
  env:
    HF_HOME: /app/.cache/huggingface
    FASTEMBED_CACHE_PATH: /app/.cache/fastembed
  resources:
    requests:
      cpu: 500m
      memory: 1028Mi
  prometheus:
    enabled: true
    port: 8000
    path: /metrics
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilization: 15
    scaleDown:
      stabilizationWindowSeconds: 100
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
# Frontend configuration
frontend:
  enabled: true
  name: frontend
  image:
    repository: ghcr.io/glebbot/book-rag/book-rag-frontend
    tag: 116281bbab646dc9bdc18920c3a6258783d03449
    pullPolicy: Always
  replicas: 1
  ports:
    http: 80
  service:
    type: LoadBalancer
  env:
    BACKEND_HOST: http://backend:8000
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
