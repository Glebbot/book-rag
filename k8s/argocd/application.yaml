apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: book-rag
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Glebbot/book-rag.git
    targetRevision: main
    path: k8s/book-rag-chart
    helm:
      releaseName: book-rag
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: book-rag
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true